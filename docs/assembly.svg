<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Microsoft YaHei', sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5f6368"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d93025"/>
    </marker>
  </defs>
  <rect width="760" height="520" fill="#ffffff"/>
  <text x="24" y="30" font-size="17" font-weight="600" fill="#202124">侧视图：只靠重力方向，算出球顶正下方的经纬度</text>

  <!-- 支架与底座 -->
  <path d="M492.4 430.6 A196 196 0 0 1 267.6 430.6" fill="none" stroke="#5f6368" stroke-width="8" stroke-linecap="round"/>
  <line x1="380" y1="466" x2="380" y2="486" stroke="#5f6368" stroke-width="8"/>
  <rect x="290" y="486" width="180" height="14" rx="4" fill="#5f6368"/>

  <!-- 子午圈 -->
  <circle cx="380" cy="270" r="186" fill="none" stroke="#9aa0a6" stroke-width="9"/>

  <!-- 球体 -->
  <circle cx="380" cy="270" r="170" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="2"/>
  <line x1="224.1" y1="202.2" x2="535.9" y2="337.8" stroke="#4a6fa5" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="500" y="352" fill="#4a6fa5" font-size="12">赤道</text>

  <!-- 极轴（默认倾斜 23.5°） -->
  <line x1="305.8" y1="440.6" x2="454.2" y2="99.4" stroke="#202124" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="447.8" cy="114.1" r="4" fill="#202124"/>
  <text x="456" y="142" fill="#202124" font-size="12">北极</text>
  <circle cx="312.2" cy="425.9" r="4" fill="#202124"/>
  <text x="322" y="416" fill="#202124" font-size="12">南极</text>

  <!-- 23.5° 夹角 -->
  <line x1="380" y1="270" x2="380" y2="100" stroke="#d93025" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M380 160 A110 110 0 0 1 423.9 169.1" fill="none" stroke="#d93025" stroke-width="1.5"/>
  <text x="386" y="150" fill="#d93025" font-size="12">23.5°</text>

  <!-- 读数点 -->
  <path d="M372 56 L388 56 L380 70 Z" fill="#d93025"/>
  <text x="396" y="64" fill="#d93025" font-weight="600">读数点：子午圈最高点正下方</text>
  <text x="24" y="104" fill="#202124">子午圈停在默认倾角时，</text>
  <text x="24" y="122" fill="#202124">球顶始终是北纬 66.5°</text>
  <line x1="180" y1="112" x2="368" y2="100" stroke="#9aa0a6" stroke-width="1"/>

  <!-- 传感器与检修口 -->
  <path d="M281.3 408.4 A170 170 0 0 1 247.0 375.8" fill="none" stroke="#e8710a" stroke-width="5"/>
  <rect x="257" y="364" width="46" height="22" rx="3" fill="#fbbc04" stroke="#e8710a" stroke-width="1.5"/>
  <text x="24" y="330" fill="#202124" font-weight="600">BWT901BLECL</text>
  <text x="24" y="348" fill="#202124">贴在检修口旁的内壁</text>
  <line x1="150" y1="342" x2="256" y2="370" stroke="#9aa0a6" stroke-width="1"/>
  <text x="24" y="430" fill="#202124">检修口：南极附近，约 55×40mm</text>
  <text x="24" y="448" fill="#202124">充电和开关都从这里够得着</text>
  <line x1="232" y1="424" x2="258" y2="400" stroke="#9aa0a6" stroke-width="1"/>

  <!-- 配重 -->
  <line x1="280" y1="375" x2="480" y2="165" stroke="#5f6368" stroke-width="1" stroke-dasharray="2 4"/>
  <circle cx="380" cy="270" r="3" fill="#5f6368"/>
  <circle cx="479.8" cy="164.8" r="10" fill="#5f6368"/>
  <text x="590" y="150" fill="#202124" font-weight="600">配重：与模块等重</text>
  <text x="590" y="168" fill="#202124">放在过球心的对称位置</text>
  <line x1="585" y1="158" x2="492" y2="164" stroke="#9aa0a6" stroke-width="1"/>

  <!-- 两种转动 -->
  <text x="590" y="88" fill="#202124">① 绕极轴转球：经度变</text>
  <line x1="585" y1="84" x2="462" y2="100" stroke="#9aa0a6" stroke-width="1"/>
  <path d="M567.9 201.6 A200 200 0 0 1 567.9 338.4" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/>
  <text x="590" y="266" fill="#202124">② 子午圈在支架里滑动：</text>
  <text x="590" y="284" fill="#202124">纬度变</text>

  <!-- 重力 -->
  <line x1="700" y1="330" x2="700" y2="420" stroke="#d93025" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="712" y="380" fill="#d93025" font-weight="600">重力</text>
</svg>
