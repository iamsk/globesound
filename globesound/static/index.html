<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>环宇寻声 globesound 地球仪</title>
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(14, 18, 28, 0.85);
    --border: rgba(255, 255, 255, 0.09);
    --text: #e8ecf3;
    --muted: #8a93a6;
    --accent: #ffb547;
    --live: #4fd1c5;
    --play: #ff6b4a;
    --kids: #48bb78;
    --off: #6b7280;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --serif: "Songti SC", "Noto Serif SC", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; overflow: hidden; }
  #globe { position: fixed; inset: 0; }
  .glass { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  button { font: inherit; color: var(--text); cursor: pointer; }

  /* 顶部中间：模式切换器 */
  .mode-bar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 4px; z-index: 20; border-radius: 999px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }
  .mode-btn {
    background: transparent; border: 0; border-radius: 999px; padding: 6px 16px;
    font-size: 13px; font-weight: 500; color: var(--muted); transition: all 0.2s ease;
  }
  .mode-btn:hover { color: var(--text); }
  .mode-btn.on {
    background: var(--accent); color: #05070d; font-weight: 600;
    box-shadow: 0 2px 10px rgba(255, 181, 71, 0.4);
  }
  .mode-btn.kids.on {
    background: linear-gradient(135deg, #48bb78, #38a169); color: #ffffff;
    box-shadow: 0 2px 10px rgba(72, 187, 120, 0.45);
  }

  /* 左上：读数 */
  .hud { position: fixed; top: 16px; left: 16px; width: 280px; padding: 14px 16px; z-index: 10; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { font-weight: 600; letter-spacing: .02em; }
  .hud-pills { display: flex; align-items: center; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; background: rgba(255,255,255,.06); color: var(--muted); white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--off); }
  .pill.moving i { background: var(--live); }
  .pill.still i { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .pill.battery { font-variant-numeric: tabular-nums; font-weight: 500; }
  .pill.battery .bat-icon { font-size: 13px; line-height: 1; margin-right: -2px; }
  .pill.battery.good { color: #68d391; background: rgba(72, 187, 120, 0.12); border: 1px solid rgba(72, 187, 120, 0.25); }
  .pill.battery.medium { color: #f6ad55; background: rgba(246, 173, 85, 0.12); border: 1px solid rgba(246, 173, 85, 0.25); }
  .pill.battery.low { color: #fc8181; background: rgba(245, 101, 101, 0.15); border: 1px solid rgba(245, 101, 101, 0.35); animation: bat-pulse 1.8s infinite; }
  @keyframes bat-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  .coord { font: 600 26px/1.1 var(--mono); margin: 12px 0 2px; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 12px; }
  .label { color: var(--muted); font-size: 11px; letter-spacing: .08em; margin: 14px 0 4px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; font: 12px/1.9 var(--mono); color: var(--muted);
    border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  li:first-child { border-top: 0; color: var(--accent); }
  .link { background: none; border: 0; padding: 0; color: var(--live); font-size: 12px; }
  .link[hidden] { display: none; }

  /* 右上：曲风 */
  .genres { position: fixed; top: 16px; right: 16px; max-width: 420px; display: flex; flex-wrap: wrap;
    gap: 6px; justify-content: flex-end; z-index: 10; }
  .chip { border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 4px 11px;
    font-size: 12px; color: var(--muted); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .chip b { font-weight: 400; opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .chip.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .chip.on b { opacity: .7; }

  /* 底部：卡片 */
  .card { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    width: min(480px, calc(100vw - 32px)); padding: 16px 18px; z-index: 10; }
  .kicker { font: 11px/1 var(--mono); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
  .kicker .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--off); margin-right: 6px; vertical-align: 1px; }
  .kicker.playing .dot { background: var(--play); box-shadow: 0 0 8px var(--play); }
  .kicker.preview .dot { background: var(--live); }
  .kicker.locked .dot { background: var(--accent); }
  .name { font: 600 24px/1.25 var(--serif); margin: 8px 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .controls { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .ctl { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: rgba(255,255,255,.05);
    display: grid; place-items: center; font-size: 14px; }
  .ctl:disabled { opacity: .35; cursor: default; }
  .ctl.main { width: 46px; height: 46px; background: var(--play); border-color: var(--play); font-size: 16px; }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; text-align: right; }
  .start { display: block; width: 100%; margin-top: 14px; padding: 11px; border: 0; border-radius: 999px;
    background: var(--play); font-weight: 600; }
  .start[hidden], .controls[hidden] { display: none; }

  /* 萌宝乐园卡片专属样式 */
  .kids-card {
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.14);
  }
  .kids-card[hidden] { display: none; }
  .kids-top-row {
    display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
  }
  .kids-avatar-btn {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.18);
    display: grid; place-items: center; font-size: 38px; cursor: pointer; flex-shrink: 0;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    user-select: none;
  }
  .kids-avatar-btn:hover { transform: scale(1.12) rotate(6deg); }
  .kids-avatar-btn:active { transform: scale(0.94); }
  .kids-info-col { flex: 1; min-width: 0; }
  .kids-badges { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .kids-tag {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--kids); color: #05070d;
  }
  .kids-region { font-size: 12px; color: var(--muted); }
  .kids-title {
    font: 600 20px/1.2 var(--serif); color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .kids-bubble {
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 12px; padding: 10px 14px; font-size: 13px; line-height: 1.55;
    color: #edf2f7; margin-bottom: 12px;
  }
  .kids-actions { display: flex; gap: 8px; margin-bottom: 12px; }
  .kids-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    border: 0; cursor: pointer; transition: transform 0.15s, opacity 0.15s;
  }
  .kids-btn:active { transform: scale(0.97); }
  .kids-btn.sfx {
    background: linear-gradient(135deg, #ffb547, #ff922b); color: #05070d;
    box-shadow: 0 4px 14px rgba(255, 181, 71, 0.35);
  }
  .kids-btn.talk {
    background: rgba(255, 255, 255, 0.1); color: var(--text);
    border: 1px solid var(--border);
  }
  .kids-btn.talk:hover { background: rgba(255, 255, 255, 0.16); }
  .kids-cand-bar {
    display: flex; align-items: center; gap: 6px; overflow-x: auto;
    scrollbar-width: none; font-size: 12px; padding-top: 4px;
  }
  .kids-cand-bar::-webkit-scrollbar { display: none; }
  .kids-cand-label { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .kids-cand-chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
    border-radius: 999px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border);
    color: var(--text); font-size: 11px; white-space: nowrap; cursor: pointer; transition: all 0.15s;
  }
  .kids-cand-chip:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-1px); }
  .kids-cand-chip.on {
    background: rgba(72, 187, 120, 0.25);
    border-color: #48bb78;
    color: #fff;
    font-weight: 600;
  }

  /* 3D地球上的萌友大图钉 */
  .kids-pin {
    transform: translate(-50%, -50%); display: flex; flex-direction: column;
    align-items: center; cursor: pointer; pointer-events: auto; transition: transform 0.2s; user-select: none;
  }
  .kids-pin:hover { transform: translate(-50%, -50%) scale(1.25); }
  .kids-pin span { font-size: 24px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8)); }
  .kids-pin small {
    font-size: 11px; font-weight: 600; color: #fff; background: rgba(0,0,0,0.68);
    border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; padding: 1px 6px;
    white-space: nowrap; backdrop-filter: blur(4px); margin-top: -2px;
  }

  /* 准星 */
  .reticle { width: 34px; height: 34px; transform: translate(-50%, -50%); pointer-events: none; position: relative; }
  .reticle::before, .reticle::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
  .reticle::before { border: 2px solid var(--live); box-shadow: 0 0 10px rgba(79,209,197,.6); }
  .reticle::after { inset: 14px; background: var(--live); }
  .reticle.still::before { border-color: var(--accent); box-shadow: 0 0 12px rgba(255,181,71,.7); }
  .reticle.still::after { background: var(--accent); }
  .country { transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap;
    font: 600 11px/1 var(--serif); letter-spacing: .08em; color: #3a2c20;
    text-shadow: 0 0 3px rgba(255,255,255,.85), 0 0 1px rgba(255,255,255,.9); transition: opacity .2s; }
  .country.big { font-size: 15px; letter-spacing: .2em; }
  .tag { position: absolute; left: 44px; top: 50%; transform: translateY(-50%); white-space: nowrap;
    font-size: 13px; text-shadow: 0 1px 4px #000, 0 0 12px #000; }
  .tag small { display: block; font: 10px/1.4 var(--mono); letter-spacing: .1em; color: var(--muted); }

  @media (max-width: 640px) {
    .mode-bar { top: 12px; }
    .hud { width: auto; right: 16px; padding: 10px 14px; top: 52px; }
    .hud .label, .hud ol { display: none; }
    .coord { font-size: 20px; margin-top: 8px; }
    .genres { top: auto; bottom: 214px; left: 16px; right: 16px; max-width: none; flex-wrap: nowrap;
      overflow-x: auto; justify-content: flex-start; scrollbar-width: none; }
    .chip { flex: none; }
    .name { font-size: 20px; }
  }
</style>
</head>
<body>
<div id="globe"></div>

<!-- 模式切换条 -->
<nav class="mode-bar glass" id="modeBar">
  <button class="mode-btn on" id="modeRadio">📻 环球电台</button>
  <button class="mode-btn kids" id="modeKids">🐼 萌宝乐园</button>
</nav>

<section class="hud glass">
  <div class="row">
    <span class="brand">环宇寻声</span>
    <div class="hud-pills">
      <span class="pill battery" id="battery" title="传感器电量">
        <span class="bat-icon" id="batteryIcon">🔋</span><span id="batteryText">--%</span>
      </span>
      <span class="pill" id="status"><i></i><span>等待数据</span></span>
    </div>
  </div>
  <div class="coord" id="coord">—</div>
  <div class="row">
    <span class="sub" id="source">还没有连上本机服务</span>
    <button class="link" id="follow" hidden>回到跟随</button>
  </div>
  <div class="label">读数（球静止约 1 秒后记一次）</div>
  <ol id="fixes"></ol>
</section>

<!-- 右上：曲风选择（电台模式专属） -->
<nav class="genres" id="genres"></nav>

<!-- 底部卡片 1：电台模式 -->
<section class="card glass" id="radioCard">
  <div class="kicker" id="kicker"><span class="dot"></span><span id="kickerText">电台目录加载中</span></div>
  <div class="name" id="stName">把地球仪上的一个地方转到最高点</div>
  <div class="meta" id="stMeta">球停稳约 1 秒，就会锁定离读数点最近的电台</div>
  <button class="start" id="start">开始收听</button>
  <div class="controls" id="controls" hidden>
    <button class="ctl" id="prev" title="同城上一个（←）">◀</button>
    <button class="ctl main" id="toggle" title="播放 / 暂停（空格）">❚❚</button>
    <button class="ctl" id="next" title="同城下一个（→）">▶</button>
    <span class="count" id="count"></span>
  </div>
</section>

  <!-- 底部卡片 2：萌宝乐园模式 -->
<section class="card glass kids-card" id="kidsCard" hidden>
  <div class="kids-top-row">
    <div class="kids-avatar-btn" id="kidsAvatar" title="点我听声音">🐼</div>
    <div class="kids-info-col">
      <div class="kids-badges">
        <span class="kids-tag" id="kidsTag">竹林小萌宠</span>
        <span class="kids-region" id="kidsRegion">中国·西南</span>
      </div>
      <div class="kids-title" id="kidsName">四川·大熊猫的家</div>
    </div>
  </div>
  <div class="kids-bubble">
    <p id="kidsTalk">哇！找到大熊猫的家啦！圆滚滚的小熊猫正在吃竹子，咔嚓咔嚓真香呀~</p>
  </div>
  <div class="kids-actions">
    <button class="kids-btn sfx" id="kidsSfxBtn" style="background: linear-gradient(135deg, #48bb78, #38a169); color: #fff;">
      <span id="kidsSfxIcon">🗣️</span><span id="kidsSfxText">听小萌友讲故事</span>
    </button>
    <button class="kids-btn talk" id="kidsTalkBtn" title="重播故事">
      <span>🔊 再次重播</span>
    </button>
  </div>
  <div class="kids-cand-bar">
    <span class="kids-cand-label">附近还有：</span>
    <div id="kidsCandidates" style="display:flex; gap:6px;"></div>
  </div>
</section>

<script src="https://unpkg.com/globe.gl@2.46.1/dist/globe.gl.min.js"></script>
<script>
const IMG = "https://unpkg.com/three-globe@2.45.6/example/img/";
const PALETTE = ["#f5d88a", "#f3b48a", "#eba7bb", "#f0a39a", "#c5b6e2", "#a9d7b4", "#efe3a2"];
const LABEL_RANK = 3.5;
const ALT = innerWidth < innerHeight ? 3.4 : 2.2;
const SMOOTH = 0.18;
const LOCK_DEG = 3;
const CITY_KM = 30;

let currentMode = "radio"; // "radio" | "kids"

const $ = id => document.getElementById(id);
const fmt = (lat, lon) =>
  `${Math.abs(lat).toFixed(1)}°${lat >= 0 ? "N" : "S"}  ${Math.abs(lon).toFixed(1)}°${lon >= 0 ? "E" : "W"}`;
const toVec = (lat, lon) => {
  const a = lat * Math.PI / 180, b = lon * Math.PI / 180;
  return [Math.cos(a) * Math.cos(b), Math.cos(a) * Math.sin(b), Math.sin(a)];
};
const toLatLon = v => {
  const n = Math.hypot(...v);
  return [Math.asin(v[2] / n) * 180 / Math.PI, Math.atan2(v[1], v[0]) * 180 / Math.PI];
};
const dot = (a, b) => (a[0] * b[0] + a[1] * b[1] + a[2] * b[2]) / Math.hypot(...a);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- 地球 ----------
const reticle = document.createElement("div");
reticle.className = "reticle";
reticle.innerHTML = '<div class="tag"></div>';
const tag = reticle.firstChild;
const marker = { lat: 0, lng: 0 };

const world = new Globe($("globe"), { animateIn: false })
  .backgroundImageUrl(IMG + "night-sky.png")
  .showGraticules(true)
  .atmosphereColor("#cfe8ff")
  .atmosphereAltitude(0.12)
  .polygonCapColor(d => PALETTE[(d.properties.color - 1) % PALETTE.length])
  .polygonSideColor(() => "rgba(0,0,0,0)")
  .polygonStrokeColor(() => "rgba(92, 70, 52, 0.6)")
  .polygonAltitude(0.004)
  .polygonsTransitionDuration(0)
  .htmlElementsData([marker])
  .htmlElement(d => d.el || reticle)
  .htmlTransitionDuration(0)
  .pointsMerge(true)
  .pointLat("lat").pointLng("lon")
  .pointAltitude(0.008)
  .pointRadius(0.14)
  .pointColor(() => "rgba(150, 28, 28, 0.6)")
  .pointsTransitionDuration(0)
  .ringLat("lat").ringLng("lon")
  .ringAltitude(0.009)
  .ringColor(d => t => d.ringColor ? d.ringColor(t) : `rgba(255,107,74,${1 - t})`)
  .ringMaxRadius(4)
  .ringPropagationSpeed(3)
  .ringRepeatPeriod(1100);

world.pointOfView({ lat: 20, lng: 100, altitude: ALT });
Object.assign(world.globeMaterial(), { shininess: 2 });
world.globeMaterial().color.set("#a6d3f0");
world.globeMaterial().emissive.set("#3b6f8f");
world.globeMaterial().emissiveIntensity = 0.35;

// 国界和国名
let labels = [];
fetch("/countries.json").then(r => r.json()).then(d => {
  world.polygonsData(d.features);
  labels = d.features.filter(f => f.properties.rank <= LABEL_RANK).map(f => {
    const el = document.createElement("div");
    el.className = "country" + (f.properties.rank <= 2 ? " big" : "");
    el.textContent = f.properties.name;
    const [lng, lat] = f.properties.label;
    return { lat, lng, el, v: toVec(lat, lng) };
  });
  updateHtmlElements();
});

new ResizeObserver(() => world.width($("globe").clientWidth).height($("globe").clientHeight)).observe($("globe"));

let follow = true;
const pause = () => { follow = false; $("follow").hidden = false; };
$("globe").addEventListener("pointerdown", pause);
$("globe").addEventListener("wheel", pause, { passive: true });
$("follow").onclick = () => { follow = true; $("follow").hidden = true; };

// 鼠标/触控拖动 3D 地球仪时实时切卡和停稳读数
function onUserRotateGlobe() {
  const pov = world.pointOfView();
  target = toVec(pov.lat, pov.lng);
  $("coord").textContent = fmt(pov.lat, pov.lng);
  setStatus("still", "已选点 · 停稳");
  reticle.className = "reticle still";
  addFix(pov.lat, pov.lng);
  if (currentMode === "kids") {
    const { best } = matchKidsZone(target);
    if (best) lockKidsZone(best, true);
  } else {
    lockAt(target);
  }
}

$("globe").addEventListener("pointerup", () => {
  if (!follow) {
    setTimeout(onUserRotateGlobe, 120);
  }
});

let dragTimer = null;
$("globe").addEventListener("pointermove", (e) => {
  if (e.buttons === 1) { // 拖拽中
    clearTimeout(dragTimer);
    dragTimer = setTimeout(() => {
      const pov = world.pointOfView();
      const t = toVec(pov.lat, pov.lng);
      $("coord").textContent = fmt(pov.lat, pov.lng);
      setStatus("moving", "转动中");
      reticle.className = "reticle";
      if (currentMode === "kids") {
        previewKidsAt(t);
        const { best } = matchKidsZone(t);
        if (best && (!curKidsZone || curKidsZone.id !== best.id)) {
          lockKidsZone(best, false); // 转动中实时切卡，但不打断发声
        }
      } else {
        previewAt(t);
      }
    }, 120);
  }
});

let target = null, current = null;
function frame() {
  if (target) {
    current = current ? current.map((c, i) => c + SMOOTH * (target[i] - c)) : target.slice();
    const [lat, lng] = toLatLon(current);
    marker.lat = lat; marker.lng = lng;
    updateHtmlElements();
    if (follow) world.pointOfView({ lat, lng, altitude: world.pointOfView().altitude || ALT }, 0);
  }
  if (labels.length) {
    const pov = world.pointOfView(), cv = toVec(pov.lat, pov.lng);
    for (const l of labels) l.el.style.opacity = dot(l.v, cv) > 0.5 ? "" : "0";
  }
  if (kidsLabels.length) {
    const pov = world.pointOfView(), cv = toVec(pov.lat, pov.lng);
    for (const k of kidsLabels) {

// ---------- Web Audio 音效发生器 ----------
class WebSynth {
  constructor() {
    this.ctx = null;
  }
  _init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") {
      this.ctx.resume();
    }
    return this.ctx;
  }
  playByKey(key) {
    const ctx = this._init();
    if (!ctx) return;
    const now = ctx.currentTime;
    try {
      if (key === "boing") {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(720, now + 0.2);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.38);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.4);
      } else if (key === "munch") {
        [0, 0.12, 0.24].forEach((tOff, idx) => {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          const t = now + tOff;
          osc.type = "square";
          osc.frequency.setValueAtTime(460 - idx * 60, t);
          osc.frequency.exponentialRampToValueAtTime(140, t + 0.08);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t); osc.stop(t + 0.09);
        });
      } else if (key === "gallop") {
        [0, 0.13, 0.26, 0.39].forEach((tOff, idx) => {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          const t = now + tOff;
          osc.type = "triangle";
          osc.frequency.setValueAtTime(idx % 2 === 0 ? 580 : 420, t);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t); osc.stop(t + 0.07);
        });
      } else if (key === "bell") {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, now);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.8);
      } else if (key === "wave") {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.linearRampToValueAtTime(280, now + 0.35);
        osc.frequency.linearRampToValueAtTime(130, now + 0.7);
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.25, now + 0.35);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.75);
      } else { // cheer / roar
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          const t = now + idx * 0.11;
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.01, t);
          gain.gain.linearRampToValueAtTime(0.25, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t); osc.stop(t + 0.32);
        });
      }
    } catch (e) {
      console.warn("WebSynth 播放异常:", e);
    }
  }
}
const synth = new WebSynth();

function matchKidsZone(v) {
  if (!v || !kidsZones.length) return { best: null, candidates: [] };
  const list = kidsZones.map(z => {
    const d = dot(z.v, v);
    const deg = Math.acos(Math.max(-1, Math.min(1, d))) * 180 / Math.PI;
    return { ...z, distDeg: deg };
  });
  list.sort((a, b) => a.distDeg - b.distDeg);
  return { best: list[0], candidates: list.slice(0, 4) };
}

function groupAt(v) {
  let best = null, bd = -2;
  for (const s of visible) { const d = dot(s.v, v); if (d > bd) { bd = d; best = s; } }
  if (!best || Math.acos(Math.min(1, bd)) * 180 / Math.PI > LOCK_DEG) return [];
  const cosCity = Math.cos(CITY_KM / 6371);
  return visible.filter(s => dot(s.v, best.v) > cosCity).sort((a, b) => b.clicks - a.clicks);
}

const audio = new Audio();
audio.preload = "none";

}
const metaOf = s => [s.country, s.genre, s.lang, s.bitrate ? `${s.bitrate} kbps` : "", s.codec]

function renderCard() {
  $("controls").hidden = !unlocked || !cur;
  $("start").hidden = unlocked;
  $("prev").disabled = $("next").disabled = group.length < 2;
  $("count").textContent = group.length > 1 ? `同城 ${idx + 1} / ${group.length}` : group.length ? "附近只有这一个" : "";
  $("toggle").textContent = audio.paused ? "▶" : "❚❚";
  if (currentMode === "radio") {
    world.ringsData(cur ? [cur] : []);
  }
}

function play(i) {
  idx = (i + group.length) % group.length;
  cur = group[idx];
  showStation(cur, "locked");
  if (unlocked) {
    setKicker("locked", "连接中……");
    audio.src = cur.url;
    audio.play().catch(() => {});
    const st = cur;
    clearTimeout(connectTimer);
    connectTimer = setTimeout(() => { if (cur === st && audio.readyState < 3) audio.onerror(); }, CONNECT_MS);
  } else {
    setKicker("locked", "已锁定 · 点下面开始收听");
  }
  renderCard();
}

const CONNECT_MS = 10000;
let failStreak = 0, connectTimer = null;
audio.onplaying = () => { clearTimeout(connectTimer); failStreak = 0; setKicker("playing", "正在播放"); renderCard(); };
audio.onpause = renderCard;
audio.onerror = () => {
  clearTimeout(connectTimer);
  if (!cur || !audio.src) return;
  failStreak++;
  if (failStreak < group.length) {
    setKicker("", `${cur.name} 连不上，换下一个`);
    setTimeout(() => play(idx + 1), 400);
  } else {
    setKicker("", "这一带的电台都连不上，换个地方试试");
    renderCard();
  }
};

  unlocked = true;
  synth._init();
  if (cur) play(idx); else renderCard();
};
$("toggle").onclick = () => { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); };
$("prev").onclick = () => { failStreak = 0; play(idx - 1); };
$("next").onclick = () => { failStreak = 0; play(idx + 1); };
addEventListener("keydown", e => {
  if (currentMode === "kids") {
    if (e.key === " " && curKidsZone) {
      e.preventDefault();
      synth.playByKey(curKidsZone.sfx || "cheer");
    } else if ((e.key === "Enter" || e.key === "t" || e.key === "T") && curKidsZone) {
      e.preventDefault();
      speakKidsStory(curKidsZone.talk);
    }
    return;
  }
  if (!cur || !unlocked) return;
  if (e.key === "ArrowLeft") $("prev").click();
  else if (e.key === "ArrowRight") $("next").click();
  else if (e.key === " ") { e.preventDefault(); $("toggle").click(); }
});

function lockAt(v) {
  if (!v || !visible.length) return;
  const g = groupAt(v);
  if (!g.length) {
    tag.innerHTML = `<small>${LOCK_DEG}° 内没有${genre === "全部" ? "" : esc(genre)}电台</small>`;

  if (cur && g.includes(cur)) { group = g; idx = g.indexOf(cur); showStation(cur, "locked"); renderCard(); return; }
  group = g; failStreak = 0;
  play(0);
}

function previewAt(v) {

}

function updateBatteryDisplay(pct) {
  const el = $("battery");
  if (!el) return;
  if (pct === null || pct === undefined || isNaN(pct)) {
    el.style.display = "none";
    return;
  }
  el.style.display = "inline-flex";
  const p = Math.max(0, Math.min(100, Math.round(pct)));
  const txt = $("batteryText");
  if (txt) txt.textContent = `${p}%`;
  el.classList.remove("good", "medium", "low");
  const icon = $("batteryIcon") || el.querySelector(".bat-icon");
  if (p < 20) {
    el.classList.add("low");
    if (icon) icon.textContent = "🪫";
  } else if (p < 50) {
    el.classList.add("medium");
    if (icon) icon.textContent = "🔋";
  } else {
    el.classList.add("good");
    if (icon) icon.textContent = "🔋";
  }
}

    updateBatteryDisplay(s.battery);
  }
  if (s.still && !lastStill) {
    addFix(s.lat, s.lon);
    if (currentMode === "kids") {
      const { best } = matchKidsZone(target);
      if (best) lockKidsZone(best, true);
    } else {
      lockAt(target);
    }
  }
  if (!s.still && performance.now() - lastPreview > 250) {
    lastPreview = performance.now();
    if (currentMode === "kids") {
      previewKidsAt(target);
      const { best } = matchKidsZone(target);
      if (best && (!curKidsZone || curKidsZone.id !== best.id)) {
        lockKidsZone(best, false); // 转动中实时响应跨区切换
      }
    } else {
      previewAt(target);
    }
  }
  lastStill = s.still;
  clearTimeout(staleTimer);
  staleTimer = setTimeout(() => setStatus("", "没有新数据"), 1500);
};
es.onerror = () => {
  setStatus("", "连接断开，重连中");
  $("source").textContent = "确认 python -m globesound --web 还在运行";
};

loadKidsZones();
loadStations();
</script>
</body>
